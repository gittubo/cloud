<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Just10 Group — Building landmarks</title>
    <meta name="description" content="Just10 Group is a design-and-build construction company delivering landmark hospitality, residential and commercial projects — from first survey to final handover." />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <meta property="og:title" content="Just10 Group — Building landmarks" />
    <meta property="og:description" content="From raw earth to landmark. Scroll the story of a build." />
    <meta property="og:image" content="/brand/logo-full.png" />
    <link rel="preload" as="image" href="/frames/hd/f00000.webp" />
  </head>
  <body data-page="home">
    <div class="preloader" aria-hidden="true">
      <img class="preloader__mark" src="/brand/logo-mark.png" alt="" />
      <div class="preloader__bar"><span></span></div>
      <p class="preloader__label">Preparing the site <span class="preloader__pct">0%</span></p>
    </div>

    <header class="nav nav--home"></header>

    <main id="top">
      <section class="story" aria-label="The story of a build">
        <div class="stage">
          <canvas class="ambient" width="48" height="85" aria-hidden="true"></canvas>
          <div class="panel">
            <canvas class="film" aria-hidden="true"></canvas>
            <div class="bloom" aria-hidden="true"></div>
          </div>
          <div class="grain" aria-hidden="true"></div>
          <div class="captions"></div>

          <div class="reveal">
            <h1 class="reveal__logo">
              <span class="sr-only">Just10 Group</span>
              <span class="reveal__glow" aria-hidden="true"></span>
              <img class="layer layer--mark" src="/brand/logo-mark.png" alt="" />
              <img class="layer layer--divider" src="/brand/logo-divider.png" alt="" />
              <img class="layer layer--just10" src="/brand/logo-just10.png" alt="" />
              <img class="layer layer--group" src="/brand/logo-group.png" alt="" />
            </h1>
            <p class="reveal__tagline"></p>
            <p class="reveal__actions">
              <a class="button" href="./resort.html">Discover the resort <i aria-hidden="true">→</i></a>
              <a class="button button--ghost" href="./contact.html">Start a project</a>
            </p>
          </div>

          <ol class="rail" aria-hidden="true"></ol>
          <div class="progress" aria-hidden="true"><span></span></div>
          <p class="cue" aria-hidden="true"><span>Scroll to build</span><i></i></p>
        </div>
      </section>

      <section class="next" aria-label="Next page"></section>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
